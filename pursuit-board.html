<html lang="en">
<head>

<title>Powersort's Pursuit — live board</title>
<meta name="description" content="The live leaderboard of a Powersort's Pursuit workshop board, for the big screen.">

<style>
/* the shared Powersort brand block, as in the game page */
:root {
  --darkblue: #001C6B;
  --blue: #380FFF;
  --lightblue: #0DEDF7;
  --green: #00D600;
  --lime: #B5FF00;
  --yellow: #FFFF00;
  --ink: #EAF2FF;
  --panel: rgba(56, 15, 255, 0.16);
  --panel-line: rgba(13, 237, 247, 0.35);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--darkblue);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--lightblue); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
}
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 0.9rem clamp(1rem, 4vw, 3rem);
  border-bottom: 1px solid rgba(181, 255, 0, 0.25);
  position: sticky; top: 0;
  background: rgba(0, 28, 107, 0.92);
  backdrop-filter: blur(6px);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 0.9rem; text-decoration: none; }
.brand-logo-tight { width: 118px; height: auto; display: block; }
.site-nav { display: flex; gap: clamp(0.6rem, 2vw, 1.6rem); flex-wrap: wrap; align-items: baseline; }
.site-nav a {
  font-family: var(--mono); font-size: 0.92rem; color: var(--lime);
  text-decoration: none; border-bottom: 2px solid transparent; padding-bottom: 2px;
}
.site-nav a:hover { border-bottom-color: var(--lime); }
.act { padding: clamp(1.6rem, 4vw, 2.6rem) clamp(1rem, 4vw, 3rem); }
.act + .act { border-top: 1px solid rgba(181, 255, 0, 0.25); }
.act-head { max-width: 900px; }
.eyebrow {
  font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--lime);
}
h1, h2 {
  font-family: var(--mono); font-weight: 700; color: var(--lightblue);
  line-height: 1.08; margin: 0.5rem 0 1rem; letter-spacing: -0.015em;
}
h1 { font-size: clamp(1.8rem, 4.4vw, 2.9rem); }
h1 em, h2 em { font-style: normal; color: var(--lime); }
.lede { font-size: clamp(1rem, 1.6vw, 1.1rem); max-width: 68ch; color: var(--ink); }
.lede strong { color: var(--lime); font-weight: 600; }
.btn {
  font-family: var(--mono); font-size: 0.95rem; font-weight: 600;
  color: var(--lightblue); background: transparent;
  border: 2px solid var(--lightblue); border-radius: 999px;
  padding: 0.5rem 1.15rem; cursor: pointer; text-decoration: none;
  display: inline-block; transition: transform 120ms ease, background 120ms ease, color 120ms ease;
}
.btn:hover { transform: translateY(-1px); background: rgba(13, 237, 247, 0.12); }
.btn-lime { color: var(--darkblue); background: var(--lime); border-color: var(--lime); }
.btn-lime:hover { background: var(--yellow); border-color: var(--yellow); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.ctl { display: flex; flex-direction: column; gap: 0.3rem; }
.ctl > span {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
  color: var(--lime); text-transform: uppercase;
}
.ctl select, .ctl input {
  font-family: var(--mono); font-size: 0.92rem; color: var(--ink);
  background: rgba(0, 0, 0, 0.25); border: 1.5px solid var(--panel-line);
  border-radius: 8px; padding: 0.42rem 0.6rem;
}
.panel {
  border: 1px solid var(--panel-line); border-radius: 14px;
  background: var(--panel); padding: 1rem; min-width: 0;
}
.panel-title {
  font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--lime); margin-bottom: 0.7rem;
}
.site-footer {
  border-top: 1px solid rgba(181, 255, 0, 0.25);
  padding: 1.6rem clamp(1rem, 4vw, 3rem) 2.4rem;
  display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
}
.site-footer p { font-family: var(--mono); font-size: 0.85rem; margin: 0; color: var(--lightblue); }
.code-comment { color: #8FB3FF; }
.code-keyword { color: var(--lime); font-weight: 600; }
.code-func    { color: var(--lightblue); }
.code-number  { color: #CFE8FF; }

/* ============================================================
   LIVE BOARD — built for a projector: big type, no interaction
   ============================================================ */
body { overflow-x: hidden; }
.screen { padding: clamp(1rem, 2.2vw, 2rem) clamp(1rem, 3vw, 3rem) 1rem; }

.screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: clamp(.8rem, 1.6vw, 1.6rem); }
.screen-head h1 { font-size: clamp(1.6rem, 3.4vw, 3rem); margin: 0; line-height: 1.05; }
.screen-head h1 em { color: var(--lime); font-style: normal; }
.head-right { display: flex; align-items: flex-end; gap: clamp(1rem, 2.5vw, 2.5rem); }
.stat { text-align: right; }
.stat .k { display: block; font-family: var(--mono); font-size: clamp(.6rem, .8vw, .72rem); letter-spacing: .16em; text-transform: uppercase; color: var(--lime); }
.stat .v { font-family: var(--mono); font-weight: 700; font-size: clamp(1.4rem, 3vw, 2.6rem); color: var(--lightblue); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.board-chip {
  font-family: var(--mono); font-size: clamp(.8rem, 1.3vw, 1.1rem); font-weight: 600;
  color: var(--darkblue); background: var(--lightblue); border-radius: 999px; padding: .1rem .8rem;
}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(230px, 22vw, 340px), 1fr)); gap: clamp(.6rem, 1.1vw, 1rem); }
.card {
  position: relative; background: var(--panel); border: 1.5px solid var(--panel-line); border-radius: 14px;
  padding: clamp(.6rem, 1vw, .9rem) clamp(.7rem, 1.1vw, 1rem); overflow: hidden;
}
.card.is-empty { opacity: .45; }
.card.is-opt { border-color: var(--green); }
.card.just-in { animation: flash 2.4s ease-out; }
@keyframes flash {
  0% { border-color: var(--yellow); box-shadow: 0 0 0 6px rgba(255,255,0,.28); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,0,0); }
}
.card .lvl {
  font-family: var(--mono); font-size: clamp(.58rem, .75vw, .68rem); letter-spacing: .12em; text-transform: uppercase;
  color: var(--darkblue); background: var(--lightblue); border-radius: 999px; padding: .02rem .5rem; font-weight: 600;
}
.card .lvl.custom { background: rgba(13,237,247,.2); color: var(--lightblue); }
.card .name { font-family: var(--mono); font-size: clamp(.8rem, 1.1vw, 1.05rem); color: var(--lightblue); font-weight: 600; margin-left: .4rem; }
.card .runs { font-family: var(--mono); font-size: clamp(.6rem, .75vw, .7rem); color: rgba(234,242,255,.5); margin-top: .15rem; }
.card .best { display: flex; align-items: baseline; gap: .5rem; margin-top: .35rem; flex-wrap: wrap; }
.card .cost { font-family: var(--mono); font-weight: 700; font-size: clamp(1.5rem, 2.8vw, 2.3rem); color: var(--lime); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.card.is-opt .cost { color: var(--green); }
.card .holder { font-family: var(--mono); font-size: clamp(.72rem, 1vw, .95rem); color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .marks { display: inline-flex; gap: .3rem; align-items: center; }
.card .star { color: var(--green); }
.card .arm { width: 1.05em; height: 1.05em; color: var(--lime); display: inline-block; vertical-align: -.15em; }
.card .arm svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.card .runners { font-family: var(--mono); font-size: clamp(.62rem, .8vw, .74rem); color: rgba(234,242,255,.62); margin-top: .25rem; line-height: 1.6; }
.card .runners span { color: rgba(234,242,255,.85); }
.card .foot { font-family: var(--mono); font-size: clamp(.58rem, .72vw, .68rem); color: rgba(234,242,255,.42); margin-top: .35rem; }
.card .none { font-family: var(--mono); font-size: clamp(.72rem, 1vw, .9rem); color: rgba(234,242,255,.5); margin-top: .4rem; }
.card .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--lime); opacity: .5; }
.card.is-opt .bar { background: var(--green); }

.section-title { font-family: var(--mono); font-size: clamp(.62rem, .8vw, .72rem); letter-spacing: .16em; text-transform: uppercase; color: var(--lime); margin: clamp(1rem, 1.8vw, 1.6rem) 0 .5rem; }

.ticker { position: sticky; bottom: 0; margin-top: clamp(.8rem, 1.6vw, 1.4rem); border-top: 1px solid var(--panel-line); background: var(--darkblue); padding: .5rem clamp(1rem, 3vw, 3rem); display: flex; align-items: center; gap: 1.2rem; }
.ticker .label { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); white-space: nowrap; }
.ticker .items { display: flex; gap: 1.6rem; overflow: hidden; font-family: var(--mono); font-size: clamp(.68rem, .95vw, .85rem); color: rgba(234,242,255,.75); white-space: nowrap; }
.ticker .items b { color: var(--lightblue); font-weight: 600; }
.ticker .items i { color: var(--lime); font-style: normal; }
.status { font-family: var(--mono); font-size: .68rem; color: rgba(234,242,255,.45); margin-left: auto; white-space: nowrap; }
.status.is-err { color: var(--yellow); }
.setup { max-width: 44rem; margin: 10vh auto; font-family: var(--mono); font-size: .9rem; line-height: 1.8; color: var(--ink); }
.setup code { color: var(--lightblue); }
.setup h2 { font-size: 1.4rem; }
@media (prefers-reduced-motion: reduce) { .card.just-in { animation: none; } }

<script>
"use strict";

/* ==========================================================================
   MERGE TREES  --  the same two helpers the lab and the workshop use.
     leaf(i, len)   the i-th input run
     merge(a, b)    one merge of two adjacent trees
   The merge cost is the sum of the lengths of all internal nodes.
   A node also carries h, its height: 0 for a run, 1 + max(children) otherwise,
   which is the row the game draws it in.
   ========================================================================== */
/* @shared-begin  (build.py copies this block into worker/src/merge-tree.js) */
function leaf(i, len) { return { lo: i, hi: i, len, left: null, right: null, h: 0 }; }
function merge(a, b) { return { lo: a.lo, hi: b.hi, len: a.len + b.len, left: a, right: b, h: Math.max(a.h, b.h) + 1 }; }
function mergeCost(t) { return t.left === null ? 0 : t.len + mergeCost(t.left) + mergeCost(t.right); }
const idOf = t => t.lo + ':' + t.hi;
const sum = a => a.reduce((x, y) => x + y, 0);

/* Positions, the workshop's "style A": position k merges the blocks currently at
   k and k+1, counting all blocks from the left.  Any prefix of a full merge
   sequence is a valid game in progress, so this returns a forest. */
function buildForest(runs, positions) {
  const blocks = runs.map((len, i) => leaf(i, len));
  positions.forEach((k, step) => {
    if (!Number.isInteger(k) || k < 0 || k + 1 >= blocks.length)
      throw new Error(`merge ${step + 1}: position ${k} is out of range (there are ${blocks.length} blocks, so 0 … ${blocks.length - 2})`);
    blocks.splice(k, 2, merge(blocks[k], blocks[k + 1]));
  });
  return blocks;
}

/* Tree literals: a run is its length, a merge is "(left right)".  This is the
   human-readable form of the export and is accepted on import. */
function treeLiteral(t) { return t.left === null ? String(t.len) : `(${treeLiteral(t.left)} ${treeLiteral(t.right)})`; }
function forestLiteral(forest) { return forest.map(treeLiteral).join(' '); }

/* A short, stable fingerprint of a tree literal (cyrb53).  The server stores
   it so identical trees are entered once and so the page can recognise its
   own trees on the global board without anyone's tree being sent back. */
function treeHash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
/* @shared-end */

/* Spans, the workshop's "style B": (i, j) merges the two blocks that together
   cover runs i..j.  Order-free; sorting by width puts children before parents. */
function spansToPositions(r, spans) {
  const blocks = []; for (let i = 0; i < r; i++) blocks.push([i, i]);
  const out = [];
  const sorted = spans.slice().sort((a, b) => (a[1] - a[0]) - (b[1] - b[0]));
  for (const [lo, hi] of sorted) {
    let k = -1;
    for (let i = 0; i + 1 < blocks.length; i++)
      if (blocks[i][0] === lo && blocks[i + 1][1] === hi) { k = i; break; }
    if (k < 0) throw new Error(`span (${lo}, ${hi}) does not match two adjacent blocks`);
    blocks.splice(k, 2, [lo, hi]);
    out.push(k);
  }
  return out;
}

function parseTreeLiteral(text) {
  const toks = text.match(/\(|\)|\d+/g) || [];
  let p = 0;
  const runs = [], spans = [];
  function node() {
    if (p >= toks.length) throw new Error('tree literal ends too early');
    const t = toks[p++];
    if (t === '(') {
      const a = node(), b = node();
      if (toks[p++] !== ')') throw new Error('each "(" must hold exactly two parts and a closing ")"');
      spans.push([a[0], b[1]]);
      return [a[0], b[1]];
    }
    if (t === ')') throw new Error('unexpected ")"');
    const v = parseInt(t, 10);
    if (!(v >= 1)) throw new Error('run lengths must be positive');
    runs.push(v);
    return [runs.length - 1, runs.length - 1];
  }
  while (p < toks.length) node();          // several trees = a forest = game in progress

/* ==========================================================================
   OPT  --  the cheapest tree of all, by dynamic programming (Knuth's
   monotonicity keeps it quadratic).  Hidden from players unless unlocked.
   ========================================================================== */
function optimal(runs) {
  const r = runs.length;
  if (r === 1) return leaf(0, runs[0]);
  const end = [0];
  runs.forEach(l => end.push(end[end.length - 1] + l));
  const cost = [], cut = [];
  for (let i = 0; i < r; i++) { cost.push(new Float64Array(r)); cut.push(new Int32Array(r)); }
  for (let i = 0; i < r; i++) cut[i][i] = i;
  for (let width = 2; width <= r; width++)
    for (let i = 0; i + width <= r; i++) {
      const j = i + width - 1;
      const from = Math.max(i, cut[i][j - 1]), to = Math.min(j - 1, cut[i + 1][j]);
      let best = Infinity, bestK = from;
      for (let k = from; k <= to; k++) {
        const c = cost[i][k] + cost[k + 1][j];
        if (c < best) { best = c; bestK = k; }
      }
      cost[i][j] = best + (end[j + 1] - end[i]);
      cut[i][j] = bestK;
    }
  const build = (i, j) => i === j ? leaf(i, runs[i]) : merge(build(i, cut[i][j]), build(cut[i][j] + 1, j));
  return build(0, r - 1);
}

/* Powersort itself, for the Easter egg: the tree Powersort's merge policy
   builds for these runs.  nodePower is the bit-fiddling from the CPython
   implementation: with the array as the unit interval, the power of the
   boundary between two runs is the depth of the first dyadic split that
   separates their midpoints.  Powersort keeps runs on a stack, each with the
   power of the boundary to its right, and merges the top with the current run
   as long as that power is larger than the next boundary's.  Ties are not
   merged early, so among equal powers the leftmost boundary ends up as the
   shallower node. */
function nodePower(s1, n1, n2, n) {
  let a = 2 * s1 + n1, b = a + n1 + n2, l = 0;
  for (;;) {
    l++;
    if (a >= n) { a -= n; b -= n; }
    else if (b >= n) break;
    a <<= 1; b <<= 1;
  }
  return l;
}
function powersortTree(runs) {
  const n = sum(runs);
  const X = [], P = [];                            // stack of trees and of their right-boundary powers
  let cur = leaf(0, runs[0]), start = 0;
  for (let i = 1; i < runs.length; i++) {
    const p = nodePower(start, runs[i - 1], runs[i], n);
    while (P.length && P[P.length - 1] > p) { P.pop(); cur = merge(X.pop(), cur); }
    X.push(cur); P.push(p);
    start += runs[i - 1];
    cur = leaf(i, runs[i]);
  }
  while (X.length) cur = merge(X.pop(), cur);
  return cur;
}

function entropy(runs) {                      // H in bits per element
  const n = sum(runs);
  return runs.reduce((a, l) => a + (l / n) * Math.log2(n / l), 0);
}

/* random inputs, the lab's generic generators (nothing here names a method) */
function rescale(parts, n) {
  const r = parts.length, s = sum(parts) || r;
  let out = parts.map(x => Math.max(1, Math.round(x / s * n)));
  let diff = n - sum(out);
  for (let g = 0; diff !== 0 && g < 4 * r + 8; g++) {
    const i = g % r;
    if (diff > 0) { out[i]++; diff--; } else if (out[i] > 1) { out[i]--; diff++; }
  }
  return out;
}
function randomComposition(n, r) {
  r = Math.max(1, Math.min(r, n));
  const cuts = new Set();
  while (cuts.size < r - 1) cuts.add(1 + Math.floor(Math.random() * (n - 1)));
  const c = [...cuts].sort((a, b) => a - b);
  const out = []; let prev = 0;
  for (const x of c) { out.push(x - prev); prev = x; }
  out.push(n - prev);
  return out;
}
const GENERATORS = [
  { id: 'random',    label: 'random composition',    make: (n, r) => randomComposition(n, r) },
  { id: 'geometric', label: 'geometric run lengths', make: (n, r) => rescale(Array.from({ length: r }, () => 1 - Math.log(1 - Math.random())), n) },
  { id: 'equal',     label: 'equal runs',            make: (n, r) => rescale(Array(r).fill(1), n) },

  { id: 'spike',     label: 'one huge run + tiny runs', make: (n, r) => rescale([Math.max(1, n - r + 1)].concat(Array(Math.max(0, r - 1)).fill(1)), n) },

/* ==========================================================================

   The export is valid Python and matches the workshop's policy(runs) output:
       runs   = [5, 3, 3, 14, 1, 2]

   plus a tree literal and the numbers, as comments.
   ========================================================================== */
const fmt = (x, d = 2) => Number.isFinite(x) ? x.toFixed(d) : '—';
const fmtInt = x => Math.round(x).toLocaleString('en-US');

function exportText(runs, positions, { url } = {}) {
  const forest = buildForest(runs, positions);
  const n = sum(runs), H = entropy(runs), cost = sum(forest.map(mergeCost));
  const done = forest.length === 1;
  const lines = [
    "# Powersort's Pursuit \u2014 merge tree" + (done ? '' : ' (game in progress, ' + positions.length + ' of ' + (runs.length - 1) + ' merges)'),
    url ? '# ' + url : null,
    'runs = [' + runs.join(', ') + ']',
    'merges = [' + positions.join(', ') + ']' + (positions.length ? '   # position k = merge blocks k and k+1, counting all current blocks from the left' : ''),
    'tree = "' + forestLiteral(forest) + '"',
    `# cost = ${cost}   n = ${n}   nH = ${fmt(n * H)}   n(H+2) = ${fmt(n * (H + 2))}`
  ];
  return lines.filter(x => x !== null).join('\n') + '\n';
}

/* balanced-bracket slice after "name =" (a "name=1,2,3" inside a URL comment is skipped) */
function pyList(text, name) {
  const re = new RegExp('(^|[^\\w])' + name + '\\s*[=:]\\s*', 'gm');
  let m;
  while ((m = re.exec(text))) {
    const i = m.index + m[0].length, open = text[i];
    if (open === '"' || open === "'") { const j = text.indexOf(open, i + 1); if (j > 0) return text.slice(i + 1, j); continue; }
    if (open !== '[' && open !== '(') continue;
    let depth = 0;
    for (let j = i; j < text.length; j++) {
      if (text[j] === '[' || text[j] === '(') depth++;
      else if (text[j] === ']' || text[j] === ')') { depth--; if (depth === 0) return text.slice(i, j + 1); }
    }
  }
  return null;
}
const intsIn = s => (s.match(/-?\d+/g) || []).map(Number);

/* Every element is a pair "(i, j)" -> spans; otherwise ints -> positions */
function mergesFromList(listText, r) {
  const inner = listText.trim().replace(/^[\[(]/, '').replace(/[\])]$/, '');
  const pairs = inner.match(/[\[(]\s*-?\d+\s*,\s*-?\d+\s*[\])]/g);
  if (pairs && intsIn(inner).length === 2 * pairs.length) {
    const spans = pairs.map(p => intsIn(p));
    for (const [lo, hi] of spans)
      if (!(0 <= lo && lo < hi && hi < r)) throw new Error(`span (${lo}, ${hi}) is out of range for ${r} runs`);
    return spansToPositions(r, spans);
  }
  return intsIn(inner);
}

/* Returns { runs, positions }.  currentRuns is used when the text only says
   which merges to make. */
function parseImport(text, currentRuns) {
  text = text.trim();
  if (!text) throw new Error('nothing to import');
  let runs = null, positions = null;

  const tryJSON = () => { try { return JSON.parse(text); } catch (e) { return undefined; } };
  const j = tryJSON();
  if (j && typeof j === 'object' && !Array.isArray(j) && (j.runs || j.merges || j.tree)) {
    if (j.tree && !j.runs) return parseTreeLiteral(String(j.tree));
    runs = j.runs ? j.runs.map(Number) : currentRuns.slice();
    positions = j.merges ? mergesFromList(JSON.stringify(j.merges), runs.length) : [];
  } else {
    const rl = pyList(text, 'runs'), ml = pyList(text, 'merges'), tl = pyList(text, 'tree');
    if (rl || ml) {
      runs = rl ? intsIn(rl) : currentRuns.slice();
      positions = ml ? mergesFromList(ml, runs.length) : [];
    } else if (tl) {
      return parseTreeLiteral(tl);
    } else if (/^\(/.test(text.replace(/^\s*#.*$/gm, '').trim())) {
      return parseTreeLiteral(text.replace(/^\s*#.*$/gm, ''));
    } else {
      /* a bare list of numbers: the merges for the current input */
      runs = currentRuns.slice();
      positions = mergesFromList(text, runs.length);
    }
  }
  if (!runs.length || runs.some(x => !(Number.isInteger(x) && x >= 1))) throw new Error('run lengths must be positive integers');
  if (positions.length > runs.length - 1) throw new Error(`${positions.length} merges, but ${runs.length} runs allow only ${runs.length - 1}`);
  buildForest(runs, positions);                 // validates, throws with a plain message
  return { runs, positions };
}

/* ==========================================================================
   URL  --  ?runs=5,3,3,14,1,2  opens the page on that input;
            &merges=4,3,0,0,0  or  &tree=((5 3) ...)  also loads a tree.
   ========================================================================== */
function readURL() {
  const q = new URLSearchParams(location.search);
  const out = { secret: q.has('opt') || location.hash === '#opt' };
  out.board = (q.get('board') || '').toLowerCase() || null;
  out.gate = q.has('gate') ? !/^(0|off|no|false)$/i.test(q.get('gate') || '') : null;
  out.api = q.get('api') || null;
  const rs = q.get('runs');
  if (rs) {
    const runs = intsIn(rs).filter(x => x >= 1);
    if (runs.length) {
      out.runs = runs;
      try {
        if (q.get('tree')) out.positions = parseTreeLiteral(q.get('tree')).positions;
        else if (q.get('merges')) out.positions = mergesFromList(q.get('merges'), runs.length);
        if (out.positions) buildForest(runs, out.positions);
      } catch (e) { out.positions = null; out.warn = e.message; }
    }
  } else if (q.get('tree')) {
    try { Object.assign(out, parseTreeLiteral(q.get('tree'))); } catch (e) { out.warn = e.message; }
  }
  return out;
}
function pageURL(runs, positions, extra) {

}

.384,6.098,1.052,8.548-0.844 c0.165-0.129,16.941-12.966,41.569-19.21c24.477-6.206,47.738-3.984,69.419,6.57c0.298,0.171,0.605,0.324,0.922,0.457 c6.618,3.3,13.09,7.371,19.401,12.23c1.464,1.128,3.194,1.674,4.909,1.674c2.415,0,4.804-1.081,6.39-3.142 c2.715-3.526,2.057-8.585-1.469-11.3c-6.456-4.971-12.904-9.065-19.289-12.434c-14.027-54.965,4.817-159.23,5.014-160.298 c0.219-1.195,0.165-2.424-0.157-3.595c-0.433-1.574-4.546-15.522-15.35-20.558c-3.734-1.74-9.753-3.096-17.222,0.328 c-1.426,0.653-2.894,1.355-4.409,2.079c-14.22,6.791-30.335,14.486-52.868,1.469c-15.669-9.052-17.476-15.403-17.109-16.817 c1.136-1.758,1.548-3.897,1.132-5.966c-0.463-2.299-1.904-4.282-3.949-5.433c-0.042-0.023-4.271-2.753-5.02-8.79 c-0.769-6.189,1.648-20.09,26.463-43.646c24.986-23.728,87.21,8.756,109.076,23.27c0.447,0.298,0.922,0.549,1.418,0.752 c12.631,5.149,14.842,17.593,14.92,18.051c0.159,1.074,0.534,2.105,1.1,3.03c0.807,1.316,76.889,127.027,75.263,256.257 c-0.378-0.277-0.752-0.541-1.117-0.791c-3.678-2.504-8.69-1.551-11.194,2.126c-2.504,3.678-1.552,8.69,2.126,11.194 C404.362,338.678,428.964,355.837,418.975,384.234z"/><path d="M294.474,349.802c-43.914,43.329-119.853,26.859-120.617,26.687c-4.334-0.982-8.649,1.738-9.633,6.075 c-0.986,4.339,1.733,8.656,6.073,9.641c1.472,0.335,17.156,3.769,38.561,3.769c28.848,0,68.087-6.237,96.934-34.7 c3.167-3.125,3.201-8.227,0.076-11.394C302.743,346.712,297.643,346.676,294.474,349.802z"/><path d="M333.317,145.422c-4.131,1.648-6.143,6.334-4.499,10.466c0.241,0.605,23.924,61.309,11.079,131.941 c-0.796,4.378,2.108,8.572,6.486,9.369c0.488,0.089,0.972,0.131,1.451,0.131c3.819,0,7.211-2.727,7.918-6.617 c13.703-75.36-10.915-138.166-11.97-140.802C342.132,145.782,337.446,143.777,333.317,145.422z"/></svg>';

if (!API) {
  $('screen').innerHTML = '<div class="setup"><h2>Almost there</h2>' +
    '<p>This page needs the address of your leaderboard Worker. Open <code>pursuit-board.html</code> ' +
    '(or <code>src/part4_board.html</code> and rebuild) and put it into <code>const BOARD_URL</code>, ' +
    'or pass it once as <code>?api=https://…workers.dev</code>. See <code>leaderboard-readme.md</code>.</p></div>';
  $('status').textContent = 'no board configured';
}

const seen = new Map();                 // input -> best cost seen, so improvements can flash
let firstPaint = true;

function levelOf(input) {
  const i = PRESETS.findIndex(p => p.runs.join(',') === input);
  return i < 0 ? null : { i, preset: PRESETS[i] };
}
function timeAgo(t, now) {
  const s = Math.max(0, (now - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(t).toLocaleDateString();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function card(input, data, now) {
  const runs = input.split(',').map(Number);
  const lvl = levelOf(input);
  const opt = mergeCost(optimal(runs)), psHash = treeHash(treeLiteral(powersortTree(runs)));
  const n = runs.reduce((a, b) => a + b, 0), nH = n * entropy(runs);
  const best = data && data.entries[0];
  const isOpt = best && best.cost === opt;
  const marks = e => (e.cost === opt ? '<span class="star" title="optimal">★</span>' : '') +
    (e.hash === psHash ? `<span class="arm" title="Powersort’s pick">${ARM_SVG_BOARD}</span>` : '');
  /* how far the best tree sits inside the nH … n(H+2) band */
  const share = best ? Math.max(.06, Math.min(1, 1 - (best.cost - nH) / (2 * n))) : 0;
  const fresh = best && seen.has(input) && seen.get(input) > best.cost && !firstPaint;
  return `<div class="card${best ? '' : ' is-empty'}${isOpt ? ' is-opt' : ''}${fresh ? ' just-in' : ''}">` +
    `<div><span class="lvl${lvl ? '' : ' custom'}">${lvl ? 'level ' + (lvl.i + 1) : 'own input'}</span>` +
    `<span class="name">${esc(lvl ? lvl.preset.name : runs.length + ' runs')}</span></div>` +
    `<div class="runs">${runs.length} runs · n = ${fmtInt(n)} · nH = ${nH.toFixed(0)}</div>` +
    (best
      ? `<div class="best"><span class="cost">${fmtInt(best.cost)}</span><span class="marks">${marks(best)}</span>` +
        `<span class="holder">${esc(best.player)}</span></div>` +
        `<div class="runners">${data.entries.slice(1).map(e => `<span>${fmtInt(e.cost)}</span> ${esc(e.player)} ${marks(e)}`).join(' · ') || '&nbsp;'}</div>` +
        `<div class="foot">${data.total} ${data.total === 1 ? 'tree' : 'trees'} · ${timeAgo(data.last, now)}</div>` +
        `<div class="bar" style="width:${(share * 100).toFixed(1)}%"></div>`
      : `<div class="none">nobody yet</div><div class="foot">be the first</div>`) +
    '</div>';
}

function render(data) {
  const now = data.now || Date.now();
  $('boardName').textContent = data.board + ' · live';
  document.title = `Powersort's Pursuit — ${data.board} board`;
  $('sPlayers').textContent = fmtInt(data.stats.players || 0);
  $('sTrees').textContent = fmtInt(data.stats.trees || 0);
  $('sInputs').textContent = fmtInt(data.stats.inputs || 0);

  const byInput = new Map(data.inputs.map(d => [d.input, d]));
  const levelCards = PRESETS.map(p => card(p.runs.join(','), byInput.get(p.runs.join(',')), now)).join('');
  const others = data.inputs.filter(d => !levelOf(d.input)).sort((a, b) => b.last - a.last);
  $('body').innerHTML =
    `<div class="section-title">the levels</div><div class="grid">${levelCards}</div>` +
    (others.length ? `<div class="section-title">inputs of their own</div><div class="grid">${others.map(d => card(d.input, d, now)).join('')}</div>` : '');

  $('ticker').innerHTML = data.recent.map(e => {
    const lvl = levelOf(e.input);
    return `<span><b>${esc(e.player)}</b> ${esc(lvl ? lvl.preset.name : e.input.split(',').length + ' runs')} <i>${fmtInt(e.cost)}</i></span>`;
  }).join('') || '<span>no trees yet — the first one lands here</span>';

  for (const d of data.inputs) seen.set(d.input, d.entries[0].cost);
  firstPaint = false;
}

async function tick() {
  if (!API) return;
  try {
    const r = await fetch(API + 'top?b=' + encodeURIComponent(BOARD), { cache: 'no-store' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
    render(await r.json());
    const t = new Date().toLocaleTimeString();
    $('status').classList.remove('is-err');
    $('status').textContent = `updated ${t} · every ${Math.round(EVERY / 1000)} s`;
  } catch (e) {
    $('status').classList.add('is-err');
    $('status').textContent = 'cannot reach the board (' + e.message + ') — retrying';
  }
}
if (API) { tick(); setInterval(tick, EVERY); }

/* ---- gentle auto-scroll, so a long board still shows every level on a screen
   nobody touches.  Any manual scroll or key pauses it for half a minute;
   ?scroll=0 switches it off. ---- */
const AUTOSCROLL = !/^(0|off|no|false)$/i.test(qs.get('scroll') || '1') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = 0, phase = 'down', hold = 0;
function overflow() { return document.documentElement.scrollHeight - innerHeight; }
function step() {
  if (!AUTOSCROLL || Date.now() < paused) return;
  const max = overflow();
  if (max < 24) { phase = 'down'; return; }
  if (hold > 0) { hold--; return; }
  if (phase === 'down') {
    scrollBy(0, 1);
    if (scrollY >= max - 1) { phase = 'up'; hold = 90; }        // ~3 s at the bottom
  } else {
    scrollTo({ top: 0, behavior: 'smooth' });
    phase = 'down'; hold = 90;                                   // and ~3 s at the top
  }
}
setInterval(step, 33);
for (const ev of ['wheel', 'touchstart', 'keydown', 'mousedown'])
  addEventListener(ev, () => { paused = Date.now() + 30000; }, { passive: true });
</script>
